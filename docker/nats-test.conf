# NATS server for the automated test suites (vitest integration + playwright).
# JetStream storage lives in the container's tmp dir with no volume behind it,
# so every `docker compose up` starts from a blank slate.

port: 4222
http_port: 8222

websocket {
  port: 9222
  no_tls: true
}

# Limits are ceilings, not allocations. The UI's create-stream dialog
# defaults to max_bytes = 1GB, and the server rejects any stream whose
# reservation exceeds the store ("insufficient storage resources available"),
# so leave room for several of those in parallel.
jetstream {
  store_dir: "/tmp/nats/jetstream"
  max_memory_store: 1GB
  max_file_store: 8GB
}
